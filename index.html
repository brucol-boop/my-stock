<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Stock</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Stock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: single column app, 2-up product grid, bottom sheet for details */
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#14201C; --muted:#667470; --line:#DCE3E0;
  --accent:#1D6B58; --accent-ink:#FFFFFF; --sheet:#FFFFFF; --shadow:0 1px 2px rgba(20,32,28,.06),0 6px 18px rgba(20,32,28,.06);
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#18211E; --ink:#E8EFEC; --muted:#8FA09A; --line:#2A3632;
    --accent:#5CC6A8; --accent-ink:#06211A; --sheet:#1B2522; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#18211E; --ink:#E8EFEC; --muted:#8FA09A; --line:#2A3632;
  --accent:#5CC6A8; --accent-ink:#06211A; --sheet:#1B2522; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:20px 16px 110px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.addbtn{width:44px;height:44px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:12px 12px 12px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .2s}
.card:active{transform:scale(.98)}
.card.stocked{border-color:color-mix(in srgb,var(--pc) 45%,var(--line))}
.card.archived{opacity:.6}
.icowrap{display:grid;place-items:center;height:104px;margin:6px 0 8px}
.icowrap .ico{height:100%;width:auto;overflow:visible}
.ico.art{}
.card .icowrap .ico.art{height:80px;width:80px;margin:-6px 0 -4px}
.hero .herotile .ico.art{height:66px;width:66px}
.ptileS .ico.art{width:40px;height:40px}
.minis{position:absolute;top:10px;right:10px;display:flex;flex-direction:row-reverse;align-items:center;gap:1px}
.minis .ico{width:22px;height:22px}
.minis .more{font-size:11px;font-weight:600;color:var(--muted);margin-right:3px}
.en{font-weight:600;font-size:15px;line-height:1.2}
.fr{font-style:italic;color:var(--muted);font-size:12.5px;margin-top:1px;line-height:1.2}
.stat{display:flex;align-items:baseline;gap:6px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.lvl{font-weight:600}
.qty{color:var(--muted);font-variant-numeric:tabular-nums}
.empty .lvl{color:var(--muted)}
/* icon parts */
.ico .sil path,.ico .sil ellipse,.ico .sil rect{fill:color-mix(in srgb,var(--ink) 7%,transparent);stroke:none}
.ico .out path,.ico .out ellipse,.ico .out rect{fill:none;stroke:color-mix(in srgb,var(--ink) 42%,transparent);stroke-width:2;stroke-linejoin:round}
.ico .det path,.ico .det ellipse,.ico .det rect{fill:none;stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fillr{transition:transform .7s cubic-bezier(.3,.8,.3,1)}
.minis .out path{stroke-width:3}
.state-msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
.note{margin-top:22px;font-size:12.5px;color:var(--muted);text-align:center}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(8,14,12,.5);display:none;z-index:20}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:24px 24px 0 0;padding:8px 18px 32px;z-index:21;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{display:block;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.on{animation:none}.fillr{transition:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:color-mix(in srgb,var(--ink) 8%,transparent);font-size:18px;line-height:1}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:6px;padding-right:36px}
.hero .ico{height:96px;width:auto;flex:none;overflow:visible}
.hero h2{font-family:var(--font-display);font-size:23px;margin:0;line-height:1.1;letter-spacing:-.01em}
.hero .fr{font-size:14px}
.hero .stat{margin-top:8px;font-size:14px}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.pack{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--surface)}
.packhead{display:flex;align-items:center;gap:10px}
.packhead .ico{width:30px;height:30px;flex:none}
.packhead .ico .out path{stroke-width:3}
.packname{font-weight:600;font-size:14px}
.packmeta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.packhead .sp{flex:1}
input[type=range]{width:100%;margin:12px 0 8px;accent-color:var(--pc,var(--accent));height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:500}
.chip.danger{color:#C2413B;border-color:color-mix(in srgb,#C2413B 40%,var(--line))}
.exact{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:13px;color:var(--muted)}
.exact input{width:70px}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;font-size:14.5px}
.exact input{padding:5px 8px;font-size:13px}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.block{width:100%}
.btn.danger{color:#C2413B;border-color:color-mix(in srgb,#C2413B 40%,var(--line))}
.hist{list-style:none;margin:0;padding:0}
.hsum{display:flex;gap:8px;margin:2px 0 12px}
.hsum>div{flex:1;background:var(--fillgray,rgba(120,120,128,.14));border-radius:14px;padding:9px 11px;min-width:0}
.hsum small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hsum b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.hist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.sbadge{flex:none;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.02em;color:#fff;background:var(--sc,#8E8E93);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.hist .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hist .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .r{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.hist .pr{font-size:16px;font-weight:700}
.hist .up{font-size:11.5px;color:var(--muted)}
.hist .chg{font-size:11.5px;font-weight:700}
.hist .chg.dn{color:#1F9D55}.hist .chg.hi{color:#E5484D}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.sale,.best{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;color:#fff;border-radius:6px;padding:1px 6px}
.sale{background:#E5484D}.best{background:#1F9D55}
.hist li.dim{opacity:.35}
.hist li[data-store]{cursor:pointer}
.perkg{color:var(--muted);font-size:12px}
/* groceries by store */
.gwrap{grid-column:1/-1;display:block}
.gchips{display:flex;gap:8px;margin:0 -16px;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 9px;border-radius:20px;background:var(--surface);color:var(--ink);border:0;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.gchip.on{background:var(--accent);color:var(--accent-ink)}
.gchip b{display:block;font-size:14px;font-weight:600;line-height:1.15}
.gchip small{display:block;font-size:11.5px;line-height:1.2;color:var(--muted)}
.gchip.on small{color:rgba(255,255,255,.82)}
.gall{width:24px;height:24px;border-radius:8px;background:var(--fillgray,rgba(120,120,128,.18));display:grid;place-items:center;font-size:11px;font-weight:800}
.gchip.on .gall{background:rgba(255,255,255,.28)}
.gstore{margin-top:14px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:13px 14px;display:flex;align-items:center;gap:12px}
.gstore .sbadge{width:40px;height:40px;border-radius:12px}
.gstore b{display:block;font-size:17px;font-weight:700}
.gstore small{font-size:12.5px;color:var(--muted)}
.gsec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 8px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gsec span+span{text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.glist{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.gck{flex:none;width:30px;height:30px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
.gck i{width:26px;height:26px;border-radius:13px;border:2px solid #C7C7CC;box-sizing:border-box;display:grid;place-items:center;transition:background .2s,border-color .2s,transform .25s var(--ease-spring,ease)}
.gck i svg{opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s var(--ease-spring,ease)}
.grow.done .gck i{background:var(--accent);border-color:var(--accent);transform:scale(1.06)}
.grow.done .gck i svg{opacity:1;transform:none}
.gmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.gtile{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.gtile svg{width:30px;height:30px}
.gtile svg.art{width:38px;height:38px}
.gtile{background-blend-mode:normal}
.gtx{flex:1;min-width:0}
.gtx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtx small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtx small.best{color:#1F9D55;font-weight:600}
.grow.done .gtx b{text-decoration:line-through;color:var(--muted)}
.grow.done{opacity:.6}
.gpr{flex:none;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.gcheap{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.gcheap:last-child{border-bottom:0}
.gcheap .save{font-size:13px;font-weight:700;color:#1F9D55;font-variant-numeric:tabular-nums}
.gtx-note{color:var(--muted);font-size:12.5px;padding:2px 4px}
/* groceries product sheet */
.gs-head{display:flex;align-items:center;gap:12px}
.gs-tile{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.gs-tile svg{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.gs-name{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.gs-sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.gs-usual{margin-top:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gs-eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gs-price{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.gs-best{text-align:right;padding-bottom:6px}
.gs-best small{display:block;font-size:12px;color:var(--muted)}
.gs-best b{display:block;font-size:17px;font-weight:700;color:#1F9D55}
.gs-best i{font-style:normal;font-size:12px;font-weight:600;color:#1F9D55}
.gs-stats{display:flex;gap:8px;margin-top:14px}
.gs-stat{flex:1;min-width:0;background:var(--fillgray,rgba(120,120,128,.12));border-radius:16px;padding:10px 12px}
.gs-stat small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.gs-stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.gs-stat b.g{color:#1F9D55}
.gs-stat span{display:block;font-size:11.5px;color:var(--muted)}
.gs-chart{margin-top:14px;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.gs-chart .ct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.gs-chart svg{width:100%;height:70px;margin-top:6px;overflow:visible}
.gs-chart path{stroke-dasharray:1;stroke-dashoffset:0}
.gs-actions{display:flex;gap:10px;margin-top:16px}
.gs-in{animation:gsIn .46s var(--ease-out,cubic-bezier(.2,.8,.2,1)) backwards;animation-delay:calc(var(--d,0)*55ms)}
@keyframes gsIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gsDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.gs-chart.still path.line,.gs-chart.still circle{animation:none!important}
.gs-chart path.line{animation:gsDraw .9s .35s var(--ease-out,cubic-bezier(.2,.8,.2,1)) backwards}
.gs-chart circle{animation:popK .4s var(--ease-spring,cubic-bezier(.3,1.6,.5,1)) backwards;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.gs-in,.gs-chart path.line,.gs-chart circle{animation:none}}
.gs-off{margin-top:18px;grid-column:1/-1;width:100%}
.gadd{flex:none;width:34px;height:34px;border-radius:17px;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1;font-weight:500;display:grid;place-items:center;cursor:pointer;transition:transform .14s var(--ease-out,ease)}
.gadd:active{transform:scale(.88)}
.gs-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
.gs-toggle b{display:block;font-size:16px;font-weight:600}
.gs-toggle small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.gs-sw{flex:none;position:relative;width:51px;height:31px;border-radius:16px;border:0;background:rgba(120,120,128,.32);padding:0;cursor:pointer;transition:background-color .28s}
.gs-sw i{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .34s var(--ease-spring,cubic-bezier(.3,1.5,.5,1)),width .2s}
.gs-sw.on{background:#34C759}
.gs-sw.on i{transform:translateX(20px)}
.gs-sw:active i{width:33px}.gs-sw.on:active i{transform:translateX(14px)}
@media (prefers-reduced-motion:reduce){.gs-sw,.gs-sw i{transition:none}}
.empty-note{color:var(--muted);font-size:13.5px;padding:6px 0}

/* v2: the card itself is the tank; icon stays still */
.card{min-height:196px;overflow:hidden;padding:12px 12px 13px;justify-content:flex-start;background:var(--surface)}
.tankfill{position:absolute;left:0;right:0;bottom:0;top:0;z-index:0;background:color-mix(in srgb,var(--pc) 30%,var(--surface));box-shadow:inset 0 2px 0 color-mix(in srgb,var(--pc) 75%,transparent);transform:translate3d(0,100%,0);will-change:transform;transition:transform .8s cubic-bezier(.3,.8,.3,1)}
.tankfill.zero{box-shadow:none}
.ctop,.icowrap,.cbot{position:relative;z-index:1}
.minis{z-index:1}
.ctop{min-height:40px}
.ctop.hm{padding-right:64px}
.bigq{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.05;font-variant-numeric:tabular-nums}
.lvlsm{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.card.empty .bigq{color:var(--muted)}
.icowrap{flex:1;display:grid;place-items:center;height:auto;margin:0;min-height:68px}
.icowrap .ico{height:58px;width:58px}
.cbot .en{font-size:15px}
.flat .sil path,.flat .sil ellipse,.flat .sil rect{fill:var(--surface);fill-opacity:.92}
.flat .out path,.flat .out ellipse,.flat .out rect{stroke:var(--pc);stroke-opacity:1;stroke-width:2.6}
.flat .det path,.flat .det ellipse,.flat .det rect{stroke:var(--pc);stroke-opacity:.7;stroke-width:2}
.herotile{position:relative;width:96px;height:96px;flex:none;border-radius:20px;overflow:hidden;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--pc) 45%,var(--line));display:grid;place-items:center}
.hero .herotile .ico{position:relative;z-index:1;height:58px;width:58px}
.card.empty{border-style:solid}
.brand{margin-top:4px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}

/* v3: quick sheet, card stays visible and fills live */
.veil,.veil.on{display:none !important}
.sheet{max-height:min(64vh,580px);padding:8px 16px 20px;box-shadow:0 -12px 40px rgba(0,0,0,.22)}
.sheet.tall{max-height:92%}
body.sheet-open .app{padding-bottom:min(66vh,600px)}
body.sheet-open .card:not(.sel){opacity:.5}
.card{transition:opacity .2s,transform .15s,box-shadow .2s,border-color .2s}
.card.sel{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 22%,transparent)}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* v4: alphabetical lists + bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;max-width:520px;margin:0 auto;padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}

.cat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:158px;padding:16px;border-radius:22px;border:1.5px solid color-mix(in srgb,var(--cc) 40%,var(--line));background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}

.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptile{position:relative;height:118px;border-radius:22px;overflow:hidden;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--pc) 40%,var(--line));padding:0;text-align:left;color:var(--ink)}

.ppanel{flex:none;margin:0 -16px;padding:16px 16px 22px;background:color-mix(in srgb,var(--ink) 4%,var(--sheet));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.ppanel .hbar,.ppanel .qchips{margin-bottom:0}
.ptitle{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ptl{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.1}
.ptl span{font-size:15px;font-weight:600;color:var(--muted)}
.pnote{font-size:13px;color:var(--muted);margin-top:3px}
.ppct{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}

/* v7: edit product in three short tabs */
.hero.mini{gap:12px;margin-bottom:10px;padding-right:0}
.hero.mini .herotile{width:56px;height:60px;border-radius:16px}

.etab{flex:1;height:46px;border-radius:12px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}

.chips.seg .chip{flex:1;padding:0}

.stepper{display:flex;align-items:center;gap:10px}

.stpval input{border:0!important;background:transparent!important;text-align:center;font-family:var(--font-display);font-weight:700;font-size:38px!important;width:100%;padding:0!important;height:64px;min-width:0}

/* v9: motion language */
:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.5,0,.85,.35);--ease-spring:cubic-bezier(.34,1.5,.5,1)}
.sheet{overflow-x:hidden}
.sheet.on{animation:sheetUp .44s cubic-bezier(.16,1,.3,1)}
.sheet.closing{animation:sheetDown .24s var(--ease-in) forwards}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(105%)}}
@keyframes scrIn{from{opacity:0;transform:var(--from,none)}to{opacity:1;transform:none}}
@keyframes scrOut{from{opacity:1;transform:none}to{opacity:0;transform:var(--to,none)}}
@keyframes svIn{from{opacity:0;transform:translateX(var(--dx,0))}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popK{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bumpK{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
@keyframes swapK{from{opacity:.15;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bornK{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes tickU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes tickD{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes landK{0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 50%,transparent)}35%{transform:scale(1.045)}100%{transform:scale(1);box-shadow:0 0 0 16px color-mix(in srgb,var(--pc) 0%,transparent)}}
@keyframes pillK{from{transform:translateX(calc(var(--from,0)*(100% + 4px)))}}
@keyframes goutArchive{to{opacity:0;transform:translateY(28px) scale(.86)}}
@keyframes goutRestore{to{opacity:0;transform:translateY(-28px) scale(.9)}}
@keyframes goutDelete{30%{transform:scale(1.04)}to{opacity:0;transform:scale(.2) rotate(-7deg)}}
@keyframes chipIn{from{opacity:0;transform:translateX(-10px) scale(.9)}to{opacity:1;transform:none}}
.pop{animation:popK .38s var(--ease-out)}
.bump{animation:bumpK .36s var(--ease-out)}
.swapin{animation:swapK .3s var(--ease-out)}
.born{animation:bornK .5s var(--ease-spring) backwards}
.tickU{animation:tickU .28s var(--ease-out)}
.tickD{animation:tickD .28s var(--ease-out)}
.card.land{animation:landK .6s var(--ease-out)}
.backchip:not([hidden]){animation:chipIn .32s var(--ease-spring)}
.addbtn{animation:chipIn .32s var(--ease-spring)}
/* press feedback */
.chip,.qchip,.tile,.btn,.x,.etab,.stp,.icbtn,.sw,.ptile,.cat,.catrow,.backchip,.addbtn,.tabbar button{transition:transform .14s var(--ease-out),background-color .22s,border-color .22s,color .22s,box-shadow .22s}
.chip:active,.qchip:active,.tile:active,.btn:active,.x:active,.stp:active,.icbtn:active,.sw:active,.ptile:active,.cat:active,.catrow:active,.backchip:active,.addbtn:active{transform:scale(.95)}
.card:active{transform:scale(.965)}
.btn.ok{background:var(--accent);color:var(--accent-ink);animation:bumpK .3s var(--ease-out)}
/* bar fill glides */
.hfill{transition:width .5s var(--ease-out)}
/* bottom tab pill slides between tabs */
.tabbar::before{content:"";position:absolute;left:16px;top:8px;height:58px;width:calc((100% - 40px)/2);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);transform:translateX(calc(var(--i,0)*(100% + 8px)));transition:transform .46s var(--ease-spring)}
.tabbar button{z-index:1}
.tabbar button[aria-current="page"]{background:transparent;box-shadow:none}
.tabbar button[aria-current="page"] svg{animation:bumpK .42s var(--ease-out)}
/* edit tabs pill */
.etabs{position:relative}
.etabs::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:calc((100% - 16px)/3);border-radius:12px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);transform:translateX(calc(var(--i,0)*(100% + 4px)))}
.etabs.moving::before{animation:pillK .42s var(--ease-spring)}
.etab,.etab[aria-selected="true"]{position:relative;z-index:1;background:transparent;box-shadow:none}
.etab[aria-selected="true"]{color:var(--ink)}
.badge.bump{animation:bumpK .4s var(--ease-spring)}
/* toast rises and settles */
.toast{display:block;opacity:0;visibility:hidden;pointer-events:none;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,14px) scale(.96);transition:opacity .22s,transform .24s var(--ease-in),visibility 0s .24s}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .45s var(--ease-spring),visibility 0s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ===== v10: Apple-style facelift ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93; --line:#E5E5EA;
  --accent:#007AFF; --accent-ink:#FFFFFF; --sheet:rgba(250,250,252,.9);

}

  }
}

  const u=String(h||'').toUpperCase(); if(LEGACY[u]) return LEGACY[u];

  const n=parseInt(m[1],16); let r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255;

/* ---- swipe right to go back (follows the finger; needs a real horizontal drag) ---- */
(function(){
  const app=document.querySelector('.app'); let st=null, busy=false, blockClickUntil=0;
  const canBack=()=> loaded && !busy && mode===null && !$('#sheet').classList.contains('on') && ((appTab==='stock'&&catView!==null)||(appTab==='groceries'&&grocOff));
  function buildUnder(){
    const all=[...products.entries()].map(([id,p])=>Object.assign({id},p)), live=all.filter(p=>!p.archived), arch=all.filter(p=>p.archived);
    const u=app.cloneNode(true); u.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id')); u.removeAttribute('aria-live');
    const g=u.querySelector('main'); let t,sub,html,add='';
    if(appTab==='groceries'){
      const toBuy=live.filter(onList); t='Groceries';
      const ge=toBuy.filter(p=>stockLeft(p)<=0).length, gl=toBuy.filter(p=>stockLeft(p)>0&&needsBuying(p)).length, ga=toBuy.filter(p=>!needsBuying(p)).length;
      sub=toBuy.length?[ge&&ge+' empty',gl&&gl+' running low',ga&&ga+' added'].filter(Boolean).join(' · '):'Nothing to buy right now';
      html=groceryHTML(toBuy.slice().sort(byName)); add='none';
    } else {
      const empty=live.filter(p=>stockLeft(p)<=0).length, low=live.filter(p=>stockLeft(p)>0 && needsBuying(p)).length;
      t='My Stock'; sub=live.length+' items · '+empty+' empty · '+low+' low'; html=catsHTML(live,arch);
    }
    u.querySelector('h1').textContent=t; u.querySelector('.sub').textContent=sub; g.innerHTML=html; g.style.animation='none';
    u.querySelector('.backchip').hidden=true; const sb=u.querySelector('.sortbtn'); if(sb) sb.hidden=true;
    const ab=u.querySelector('.addbtn:not(.sortbtn)'); if(ab && add) ab.style.display=add;
    const n=u.querySelector('.note'); if(n) n.textContent='';
    const w=document.createElement('div'); w.className='swipe-under'; w.appendChild(u); document.body.appendChild(w); return w;
  }
  function paint(dx){
    const W=innerWidth, p=Math.max(0,Math.min(1,dx/W));
    app.style.transform='translate3d('+dx+'px,0,0)';
    if(st.under){ st.under.firstChild.style.transform='translate3d('+(-(1-p)*W*.28)+'px,0,0)'; st.under.style.setProperty('--dim',(.12*(1-p)).toFixed(3)); }
  }
  function cleanup(){ app.classList.remove('swiping'); app.style.transform=''; app.style.transition=''; if(st&&st.under) st.under.remove(); st=null; busy=false; }
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1||!canBack()){ st=null; return; }
    const t=e.touches[0], W=innerWidth;
    if(t.clientX<18||t.clientX>W*.62||e.target.closest('input,textarea,select,.sheet,.tabbar')){ st=null; return; }
    st={x:t.clientX,y:t.clientY,t:Date.now(),lock:false,dx:0,lx:t.clientX,lt:Date.now(),v:0,under:null};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!st||busy) return;
    const t=e.touches[0], dx=t.clientX-st.x, dy=t.clientY-st.y;
    if(!st.lock){
      /* near the left edge almost any rightward pull means "back"; further in it has to be clearly horizontal */
      const W=innerWidth, e=Math.max(0,Math.min(1,(W*.35-st.x)/(W*.35-30))), need=.4+(1-e)*1.8, dist=7+(1-e)*5;
      if(Math.hypot(dx,dy)<dist) return;
      if(dx>0 && dx>Math.abs(dy)*need){ st.lock=true; st.under=buildUnder(); app.classList.add('swiping'); app.style.transition='none'; }
      else { st=null; return; }                                                           // clearly vertical or leftwards: normal scroll
    }
    e.preventDefault();
    const now=Date.now(); if(now-st.lt>16){ st.v=(t.clientX-st.lx)/(now-st.lt); st.lx=t.clientX; st.lt=now; }
    st.dx=Math.max(0,dx); paint(st.dx);
  },{passive:false});
  function end(){
    if(!st) return; if(!st.lock){ st=null; return; }
    blockClickUntil=Date.now()+350; busy=true;
    const W=innerWidth, go = st.dx>W*.45 || (st.v>.9 && st.dx>W*.28), d=REDUCED?0:(go?.26:.3);
    app.style.transition='transform '+d+'s '+(go?'cubic-bezier(.3,.8,.3,1)':'cubic-bezier(.2,.8,.2,1)');
    if(st.under) st.under.firstChild.style.transition='transform '+d+'s cubic-bezier(.3,.8,.3,1)';
    paint(go?W:0); if(st.under&&go) st.under.style.setProperty('--dim','0');
    setTimeout(()=>{
      if(go){
        const u=st.under; window.scrollTo(0,0); lastTitle=null; navAnim=null;
        if(appTab==='groceries') grocOff=false; else catView=null;
        render();
        app.classList.remove('swiping'); app.style.transition=''; app.style.transform='';
        if(u) u.remove(); st=null; busy=false;
      } else cleanup();
    }, d*1000+20);
  }
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',()=>{ if(st&&st.lock){ busy=true; cleanup(); } else st=null; },{passive:true});
  document.addEventListener('click',e=>{ if(Date.now()<blockClickUntil){ e.preventDefault(); e.stopPropagation(); } },true);
})();

function commonDialog(openDlg,closeDlg){
  const sel=new Set(); let full=true;
  const cats=[['fridge','Fridge'],['pantry','Pantry'],['bathroom','Bathroom'],['household','Household']];
  const have=new Set([...products.values()].map(p=>(p.nameEn||'').toLowerCase()));
  const body=()=>cats.map(([c,n])=>'<div class="field"><label>'+n+'</label><div class="chips sm">'+COMMON.map((x,i)=>[x,i]).filter(([x])=>x[1]===c&&!have.has(x[0].toLowerCase())).map(([x,i])=>'<button class="chip" data-ci="'+i+'" aria-pressed="'+sel.has(i)+'">'+x[0]+'</button>').join('')+'</div></div>').join('');
  const d=openDlg('<h2>Common items</h2><div class="note2">Pick what you use. You can edit names, sizes and levels afterwards.</div>'+'<div class="field"><label>Stock</label><div class="chips sm"><button class="chip" id="ciFull" aria-pressed="true">One full pack each</button><button class="chip" id="ciEmpty" aria-pressed="false">Start empty</button></div></div><div id="ciBody">'+body()+'</div><div class="acts"><button class="btn" id="ciCancel">Cancel</button><button class="btn primary" id="ciAdd">Add</button></div>');
  d.addEventListener('click',e=>{ const c=e.target.closest('[data-ci]'); if(!c) return; const i=+c.dataset.ci; sel.has(i)?sel.delete(i):sel.add(i); c.setAttribute('aria-pressed',String(sel.has(i))); d.querySelector('#ciAdd').textContent=sel.size?'Add '+sel.size:'Add'; });
  d.querySelector('#ciFull').onclick=()=>{ full=true; d.querySelector('#ciFull').setAttribute('aria-pressed','true'); d.querySelector('#ciEmpty').setAttribute('aria-pressed','false'); };
  d.querySelector('#ciEmpty').onclick=()=>{ full=false; d.querySelector('#ciEmpty').setAttribute('aria-pressed','true'); d.querySelector('#ciFull').setAttribute('aria-pressed','false'); };
  d.querySelector('#ciCancel').onclick=closeDlg;
  d.querySelector('#ciAdd').onclick=()=>{ if(!sel.size){ toast('Pick at least one'); return; }
    const today=new Date().toISOString().slice(0,10);
    [...sel].forEach((i,k)=>{ const [n,cat,sub,unit,size,icon,color]=COMMON[i]; const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,5);
      db.doc('products/'+id).set({nameEn:n,nameFr:'',brand:'',category:cat,sub,icon,color,unit,packSize:size,archived:false,packs:full?[{id:'p'+Date.now().toString(36)+k,level:1,size,addedAt:today}]:[],purchases:[]}); });
    closeDlg(); toast(sel.size+' added'); };
}

(function(){
  const esc2=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  function how(){
    if(document.getElementById('howV')) return;
    const v=document.createElement('div'); v.className='dlg-veil how'; v.id='howV';
    v.innerHTML='<div class="dlg how-sheet" role="dialog" aria-modal="true" aria-label="How it works"><div style="display:flex;justify-content:space-between;align-items:center"><h2>How it works</h2><button class="btn" id="howDone" style="background:none;box-shadow:none;font-size:17px">Done</button></div><div class="note2" style="margin:4px 2px 14px;font-size:15px">Six things to know. Tap one to read more.</div>'
     +HOWTO.map((h,i)=>'<div class="hw'+(i===0?' open':'')+'"><button class="hw-h" aria-expanded="'+(i===0)+'"><span class="hw-n" style="background:'+h[0]+'">'+(i+1)+'</span><span class="hw-m"><b>'+esc2(h[1])+'</b><span>'+esc2(h[2])+'</span></span><span class="hw-c">›</span></button><div class="hw-b"><div><p>'+esc2(h[3])+'</p>'+(h[4]||'')+'</div></div></div>').join('')+'</div>';
    document.body.appendChild(v);
    const close=()=>{ v.style.transition='opacity .25s'; v.style.opacity='0'; setTimeout(()=>v.remove(),260); };
    v.addEventListener('click',e=>{
      if(e.target===v||e.target.closest('#howDone')) return close();
      const h=e.target.closest('.hw-h'); if(!h) return; const card=h.parentNode, was=card.classList.contains('open');
      v.querySelectorAll('.hw').forEach(c=>{ c.classList.remove('open'); c.querySelector('.hw-h').setAttribute('aria-expanded','false'); });
      if(!was){ card.classList.add('open'); h.setAttribute('aria-expanded','true'); }
    });
  }
  window.__how=how;
  const w=document.getElementById('welcome'); if(!w) return;
  document.getElementById('welOpen').onclick=()=>{ lastGridHTML=null; navAnim={kind:'stag'}; render(); w.classList.add('out'); setTimeout(()=>w.remove(),600); };
  document.getElementById('welHow').onclick=how;
})();

/* ---- standalone: backup & settings, log a purchase ---- */
(function(){
  const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  function open(html){ close(); const v=document.createElement('div'); v.className='dlg-veil'; v.id='dlgV'; v.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>'; v.addEventListener('click',e=>{ if(e.target===v) close(); }); document.body.appendChild(v); return v.firstChild; }
  function close(){ const v=document.getElementById('dlgV'); if(v) v.remove(); }
  function settings(){
    const cur=CUR(), chips=['$','R$','€','£'].map(c=>'<button class="chip" data-cur="'+c+'" aria-pressed="'+(c===cur)+'">'+c+'</button>').join('');
    const d=open('<h2>Backup &amp; settings</h2><div class="field"><label>Currency</label><div class="chips sm">'+chips+'</div></div>'
      +'<div class="note2">Your stock lives only on this phone. Export a backup now and then, and always open the app from the Home Screen icon.</div>'
      +'<div class="setrow"><button class="btn block tall" id="dlgCommon">Add common items</button><button class="btn block tall" id="dlgHow">How it works</button><button class="btn block tall" id="dlgExp">Export backup</button><button class="btn block tall" id="dlgImp">Import backup</button><button class="btn block tall danger" id="dlgErase">Erase everything</button></div>'
      +'<input type="file" id="dlgFile" accept="application/json,.json" hidden><div class="acts"><button class="btn primary" id="dlgDone">Done</button></div><div class="note2" style="text-align:center;margin-top:12px">My Stock · version '+APP_VERSION+'</div>');
    d.querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>{ localStorage.setItem('mystock.cur',b.dataset.cur); d.querySelectorAll('[data-cur]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); lastGridHTML=null; render(); });
    d.querySelector('#dlgDone').onclick=close; d.querySelector('#dlgCommon').onclick=()=>commonDialog(open,close); d.querySelector('#dlgHow').onclick=()=>{ close(); window.__how(); };
    d.querySelector('#dlgExp').onclick=async()=>{
      try{ localStorage.setItem('mystock.lastBackup',String(Date.now())); }catch(e){} lastGridHTML=null; const txt=window.__mystock.export(), name='my-stock-backup-'+today()+'.json', file=new File([txt],name,{type:'application/json'});
      try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'My Stock backup'}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Backup saved');
    };
    const fi=d.querySelector('#dlgFile'); d.querySelector('#dlgImp').onclick=()=>fi.click();
    fi.onchange=async()=>{ const f=fi.files[0]; if(!f) return; try{ window.__mystock.import(await f.text()); toast('Backup restored'); close(); }catch(e){ toast('That file is not a My Stock backup'); } };
    const er=d.querySelector('#dlgErase'); er.onclick=()=>{ if(er.dataset.sure){ window.__mystock.erase(); catView=null; toast('Everything erased'); close(); } else { er.dataset.sure=1; er.textContent='Tap again to erase everything'; setTimeout(()=>{ if(er.isConnected){ delete er.dataset.sure; er.textContent='Erase everything'; } },3500); } };
  }
  function logBuy(){
    const p=products.get(openId); if(!p) return;
    const stores=[...new Set((p.purchases||[]).map(x=>x.store).filter(Boolean))], unit=p.unit, last=(p.purchases||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||{};
    const d=open('<h2>Log a purchase</h2><div class="field"><label for="lbStore">Store</label><input type="text" id="lbStore" list="lbStores" placeholder="Where did you buy it?" autocomplete="off" value="'+esc(last.store||'')+'"><datalist id="lbStores">'+stores.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist></div>'
      +'<div class="row2"><div class="field"><label for="lbPrice">Price per unit ('+esc(CUR())+')</label><input type="number" id="lbPrice" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="'+esc(last.price!=null?String(last.price):'')+'"></div><div class="field"><label for="lbQty">How many</label><input type="number" id="lbQty" inputmode="numeric" min="1" step="1" value="1"></div></div>'
      +'<div class="row2"><div class="field"><label for="lbSize">Size of each ('+(unit==='pct'?'packs':esc(unit))+')</label><input type="number" id="lbSize" inputmode="decimal" min="0" step="any" value="'+esc(String(last.size||p.packSize||''))+'"></div><div class="field"><label for="lbDate">Date</label><input type="date" id="lbDate" value="'+today()+'"></div></div>'
      +'<div class="field"><label>Options</label><div class="chips sm"><button class="chip" id="lbStock" aria-pressed="true">Add to stock</button><button class="chip" id="lbPromo" aria-pressed="false">On sale</button></div></div>'
      +'<div class="acts"><button class="btn" id="lbCancel">Cancel</button><button class="btn primary" id="lbSave">Save</button></div>');
    ['#lbStock','#lbPromo'].forEach(q=>d.querySelector(q).onclick=e=>{ const b=e.currentTarget; b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')); });
    d.querySelector('#lbCancel').onclick=close;
    d.querySelector('#lbSave').onclick=()=>{
      const price=parseFloat(d.querySelector('#lbPrice').value), qty=Math.max(1,parseInt(d.querySelector('#lbQty').value,10)||1), size=parseFloat(d.querySelector('#lbSize').value)||0, store=d.querySelector('#lbStore').value.trim(), date=d.querySelector('#lbDate').value||today();
      if(!(price>=0)||isNaN(price)){ toast('Enter the price'); return; }
      const rec={date,store,price:Math.round(price*100)/100,qty,promo:d.querySelector('#lbPromo').getAttribute('aria-pressed')==='true'}; if(size) rec.size=size;
      const patch={purchases:(p.purchases||[]).concat([rec])};
      if(d.querySelector('#lbStock').getAttribute('aria-pressed')==='true'){
        const add=[]; for(let i=0;i<qty;i++) add.push({id:'p'+Date.now().toString(36)+i,level:1,size:size||p.packSize||1,addedAt:date});
        patch.packs=(p.packs||[]).concat(add);
      }
      persist(openId,patch); close(); toast('Purchase saved');
    };
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('[data-common]')){ e.preventDefault(); e.stopPropagation(); commonDialog(open,close); return; }
    if(e.target.closest('[data-settings]')){ e.preventDefault(); e.stopPropagation(); settings(); return; }
    if(e.target.closest('[data-act="logbuy"]')){ e.preventDefault(); e.stopPropagation(); logBuy(); }
  },true);
})();

/* ---------- start ---------- */
render();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
(async function start(){
  const KEY='mystock.v1';
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } };
  let store=read(), subs=[];
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){ toast('Could not save on this phone'); } };
  const snap=()=>({docs:Object.keys(store).map(id=>({id,data:()=>JSON.parse(JSON.stringify(store[id]))}))});
  const fire=()=>subs.forEach(f=>f(snap()));
  try{ if(!localStorage.getItem('mystock.firstUse')) localStorage.setItem('mystock.firstUse',String(Date.now())); }catch(e){}
  window.__mystock={ export:()=>JSON.stringify({app:'my-stock',v:1,cur:CUR(),products:store}), import:(txt)=>{ const o=JSON.parse(txt); if(!o||o.app!=='my-stock'||!o.products) throw new Error('bad'); store=o.products; if(o.cur) localStorage.setItem('mystock.cur',o.cur); save(); fire(); }, erase:()=>{ store={}; save(); fire(); } };
  db={ collection:()=>({ onSnapshot:(cb)=>{ subs.push(cb); setTimeout(()=>cb(snap()),0); } }),
       doc:(path)=>{ const id=path.split('/')[1]; return {
         update:async(patch)=>{ store[id]=Object.assign({},store[id]||{},patch); save(); fire(); },
         set:async(doc)=>{ store[id]=doc; save(); fire(); },
         delete:async()=>{ delete store[id]; save(); fire(); } }; } };
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  products=new Map(Object.keys(store).map(id=>[id,Object.assign({},store[id],{color:vivid(store[id].color)})]));
  db.collection('products').onSnapshot(sn=>{
    products=new Map(sn.docs.map(d=>{ const x=d.data(); return [d.id, Object.assign({},x,{color:vivid(x.color)})]; }));
    if(!loaded) navAnim={kind:'stag'};
    loaded=true; render();
  });
})();
</script>
